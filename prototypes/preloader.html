<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preloader Prototype</title>
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  // Only take over the screen when GSAP actually loaded; otherwise the page shows as normal.
  if (window.gsap) document.documentElement.classList.add('is-loading');
</script>
<style>
  /* Tokens copied from assets/css/styles.css and assets/hero/hero.css */
  :root {
    --primary-color: #09090b;
    --primary-accent: #3f3f46;
    --secondary-color: #71717a;
    --subtle: #a1a1aa;
    --background-color: #f4f4f5;
    --surface-color: #e4e4e7;
    --hero-marker: #f2b31b;
    --paper: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-family: Inter, sans-serif; background: var(--background-color); color: var(--primary-color); }
  @supports (font-variation-settings: normal) { html { font-family: InterVariable, sans-serif; } }
  body { min-height: 100vh; background: var(--background-color); font-feature-settings: 'liga' 1, 'calt' 1; }
  html.is-loading, html.is-loading body { overflow: hidden; }
  ::selection { background: var(--primary-color); color: var(--background-color); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--primary-color); outline-offset: 3px; border-radius: 6px; }

  /* ---------- Stand-in home page (prototype only) ---------- */
  .mock { min-height: 100vh; display: grid; place-content: center; gap: 20px; padding: 32px 16px; text-align: center; }
  .mock h1 {
    font-size: min(13.5vw, 76px); font-weight: 900; line-height: 1.16; letter-spacing: -0.04em; text-transform: uppercase;
  }
  .mock mark {
    color: inherit; padding-inline: 0.05em;
    background: linear-gradient(transparent 54%, var(--hero-marker) 54%, var(--hero-marker) 90%, transparent 90%);
  }
  .mock p { font-size: 15px; color: var(--primary-accent); }

  /* ---------- Prototype toolbar ---------- */
  .proto {
    position: fixed; top: 14px; right: 16px; z-index: 2100; display: flex; align-items: center; gap: 4px;
    padding: 4px; border-radius: 999px; background: var(--surface-color);
  }
  .proto button {
    font-size: 13px; font-weight: 500; color: var(--primary-accent); padding: 8px 12px; border-radius: 999px;
    font-variant-numeric: tabular-nums; transition: background-color .15s, color .15s;
  }
  .proto button:hover { color: var(--primary-color); }
  .proto button[aria-pressed="true"] { background: var(--background-color); color: var(--primary-color); }
  .proto .sep { width: 1px; height: 18px; background: var(--subtle); margin: 0 4px; }

  /* ================= PRELOADER ================= */
  .pl { position: fixed; inset: 0; z-index: 2000; display: none; }
  html.is-loading .pl { display: block; }

  /* Curtain: columns of the home page background with hairline grid lines */
  .pl-grid { position: absolute; inset: 0; display: flex; }
  .pl-col { flex: 1; background: var(--background-color); border-right: 1px solid var(--surface-color); }
  .pl-col:last-child { border-right: 0; }

  .pl-stage { position: absolute; inset: 0; visibility: hidden; }
  .pl.is-ready .pl-stage { visibility: visible; }

  .pl-guide { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed var(--subtle); opacity: .6; }
  .pl-cross { position: absolute; width: 11px; height: 11px; margin: -5px 0 0 -5px; }
  .pl-cross::before, .pl-cross::after { content: ""; position: absolute; background: var(--subtle); }
  .pl-cross::before { left: 5px; top: 0; width: 1px; height: 11px; }
  .pl-cross::after { top: 5px; left: 0; height: 1px; width: 11px; }

  .pl-push { position: absolute; inset: 0; will-change: transform; }

  /* The name: same type as .hero-title / .hero-marker on the home page */
  .pl-word {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; align-items: baseline; white-space: nowrap;
    font-weight: 900; line-height: 1.16; letter-spacing: -0.04em; text-transform: uppercase;
    color: var(--primary-color);
  }
  .pl-marker {
    position: absolute; left: -0.05em; right: -0.01em; top: 54%; bottom: 10%;
    background: var(--hero-marker); transform-origin: 0 50%; transform: scaleX(0);
  }
  .pl-l { position: relative; display: inline-block; will-change: transform; }
  .pl-g { display: inline-block; }
  .pl-base { display: inline-block; width: 0; height: 0; }

  /* Character: flat line art, ink #09090b on white, like the reference illustrations */
  .pl-char { position: absolute; left: 0; top: 0; transform: translate3d(-200vw, 0, 0); will-change: transform; }
  .pl-char svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .pl-char svg * {
    stroke: var(--primary-color); stroke-width: 1.5px; stroke-linejoin: round; stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
  .pl-char .ink { fill: var(--primary-color); }
  .pl-char .paper { fill: var(--paper); }
  .pl-char .back { fill: var(--surface-color); }
  .pl-char .line { fill: none; }
  .pl-char .fold { fill: none; stroke: var(--paper); }
  .pl-char .shadow { fill: var(--primary-color); stroke: none; opacity: .08; }

  /* Progress bar along the bottom edge (echoes the home page patience bar) */
  .pl-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--surface-color); }
  .pl-bar-fill { height: 100%; background: var(--primary-accent); transform-origin: 0 50%; transform: scaleX(0); }

  .pl-count {
    position: absolute; left: 20px; bottom: 24px;
    font-size: 13px; font-weight: 500; color: var(--primary-accent); font-variant-numeric: tabular-nums;
  }
  .pl-count b { font-weight: 600; color: var(--primary-color); }

  .pl-skip {
    position: absolute; right: 20px; bottom: 14px;
    font-size: 13px; font-weight: 500; color: var(--primary-accent); padding: 10px 4px;
    text-decoration: underline; text-decoration-color: var(--subtle); text-underline-offset: 4px;
    transition: color .15s, text-decoration-color .15s;
  }
  .pl-skip:hover { color: var(--primary-color); text-decoration-color: currentColor; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 640px) {
    .pl-skip { right: 12px; }
    .pl-count { left: 16px; }
    .proto { top: auto; bottom: 64px; right: 50%; transform: translateX(50%); }
  }
</style>
</head>
<body>

  <!-- Stand-in for the real home page -->
  <main class="mock">
    <h1>Xin chào,<br>I’m <mark>Thuận</mark></h1>
    <p>Stand-in for the home page. Use Replay to watch the intro again.</p>
  </main>

  <!-- ================= PRELOADER ================= -->
  <div class="pl" id="preloader">
    <div class="pl-grid" aria-hidden="true"></div>

    <div class="pl-stage" aria-hidden="true">
      <div class="pl-guide"></div>
      <div class="pl-marks"></div>

      <div class="pl-push">
      <div class="pl-word">
        <span class="pl-marker"></span>
        <span class="pl-l"><span class="pl-g">T</span></span><span class="pl-l"><span class="pl-g">h</span></span><span class="pl-l"><span class="pl-g">u</span></span><span class="pl-l"><span class="pl-g">ậ</span></span><span class="pl-l"><span class="pl-g">n</span></span><span class="pl-base"></span>
      </div>
      </div>

      <!-- SVG is assembled from the part templates in CHARACTER below -->
      <div class="pl-char"></div>
    </div>

    <div class="pl-bar" aria-hidden="true"><div class="pl-bar-fill"></div></div>
    <span class="pl-count" aria-hidden="true">Loading <b>0</b>%</span>
    <span class="sr-only" role="status">Loading Thuận Trương’s website</span>
    <button class="pl-skip" type="button">Skip intro</button>
  </div>

  <!-- Prototype-only controls -->
  <div class="proto" role="toolbar" aria-label="Prototype controls">
    <button type="button" data-replay>Replay</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-speed="0.5" aria-pressed="false">0.5×</button>
    <button type="button" data-speed="1" aria-pressed="true">1×</button>
    <button type="button" data-speed="1.5" aria-pressed="false">1.5×</button>
  </div>


<script>
/* =====================================================================
 * CHARACTER — flat line-art figure, side-on and facing right.
 * Units: feet at (0, 0), head top near y = -254. Likeness from
 * assets/art/avatar.svg: side-swept dark hair, round glasses, dot eyes,
 * small smile, blush.
 *
 * Two layers per body part:
 *  - pose groups (#legs, #torso, #left-arm, #right-arm, #head, #hair, #shirt)
 *    are tweened by GSAP around the joints in JOINTS (push, strain, lag);
 *  - inner c-* groups carry the procedural walk cycle and breathing,
 *    written every frame from the state object S.
 * Facing right, the near arm is his left arm.
 * ===================================================================== */
const RIG = {
  hip: { y: -122 }, knee: { y: -66 },
  shoulder: { y: -190 }, elbow: { y: -150 },
  neck: { x: 2, y: -205 },
  armLength: 77,          // shoulder to hand centre
  frontArmX: 4,           // shoulder offset of the near arm
  viewBox: [-60, -258, 120, 268],
};

// Pivot points (svgOrigin) for the GSAP pose groups, in character units.
const JOINTS = {
  legs: '0 0',
  torso: '0 -122',        // hip
  shirt: '0 -198',        // collar
  'left-arm': '4 -190',   // near shoulder
  'right-arm': '-3 -190', // far shoulder
  head: '2 -205',         // neck
  hair: '2 -236',         // crown
};

const CHARACTER = {
  leg: (id, fill) => `
    <g id="c-leg${id}">
      <rect class="${fill}" x="-9" y="-127" width="18" height="64" rx="8"/>
      <g id="c-knee${id}">
        <path class="${fill}" d="M-8 -70 L-8 -24 L8 -24 L8 -70 Z"/>
        <rect class="${fill}" x="-10" y="-28" width="20" height="8" rx="2"/>
        <rect class="paper" x="-4.5" y="-20" width="9" height="7"/>
        <path class="ink" d="M-7 -14 L5 -14 Q16 -12 18 -6 Q19 -3 15 -3 L-7 -3 Q-9 -8 -7 -14 Z"/>
        <path class="paper" d="M-9 -3.5 L19 -3.5 Q20.5 0 17 0 L-7 0 Q-10 0 -9 -3.5 Z"/>
      </g>
    </g>`,

  arm: (id, skin) => `
    <g id="c-arm${id}">
      <rect class="${skin}" x="-5.5" y="-172" width="11" height="26" rx="5.5"/>
      <g id="c-elbow${id}">
        <rect class="${skin}" x="-5" y="-153" width="10" height="36" rx="5"/>
        <ellipse class="${skin}" cx="0.5" cy="-113" rx="6" ry="7.5"/>
      </g>
      <path class="ink" d="M-9 -195 Q-10.5 -170 -8.5 -164 L8.5 -164 Q10.5 -170 9 -195 Q0 -199 -9 -195 Z"/>
    </g>`,

  shirt: () => `
    <rect class="paper" x="-4" y="-212" width="12" height="18"/>
    <path class="ink" d="M-15 -198 Q2 -189 17 -198 Q26 -196 27 -188 L27 -121 Q27 -117 23 -117 L-21 -117 Q-25 -117 -25 -121 L-26 -188 Q-25 -196 -15 -198 Z"/>
    <path class="fold" d="M11 -182 Q14 -160 10 -138"/>`,

  face: () => `
    <g id="c-head">
      <circle class="paper" cx="-11" cy="-226" r="4.5"/>
      <path class="paper" d="M-12 -236 Q-13 -214 -4 -210 Q3 -207 10 -210 Q18 -214 18 -232 Q18 -246 3 -246 Q-12 -246 -12 -236 Z"/>
      <g id="hair">
        <path class="ink" d="M-14 -228 Q-18 -252 2 -254 Q22 -255 20 -234 L17 -240 Q9 -233 0 -241 Q-5 -236 -9 -241 L-10 -230 Q-12 -232 -14 -228 Z"/>
      </g>
      <path class="line" d="M-3 -237 L3 -237.5 M10 -237.5 L15 -237"/>
      <g id="c-eyes">
        <circle class="ink" cx="0.5" cy="-228" r="1.2"/>
        <circle class="ink" cx="13" cy="-228" r="1.1"/>
      </g>
      <circle class="line" cx="0" cy="-228" r="5.5"/>
      <circle class="line" cx="12.5" cy="-228" r="5"/>
      <path class="line" d="M5.5 -228.5 L7.5 -228.5 M-5.5 -229 L-10 -231"/>
      <path class="line" d="M11 -223 Q12.5 -220 10.5 -219.5"/>
      <path class="line" d="M4 -215.5 Q8 -212 12 -215.5"/>
      <path class="line" d="M-5 -218 L-3.5 -220.5 M-2 -218 L-0.5 -220.5"/>
    </g>`,

  svg() {
    const [x, y, w, h] = RIG.viewBox;
    return `
    <svg viewBox="${x} ${y} ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
      <ellipse id="c-shadow" class="shadow" cx="2" cy="0" rx="30" ry="4"/>
      <g id="c-root"><g id="c-bob">
        <g id="legs">${this.leg('B', 'back')}${this.leg('F', 'paper')}</g>
        <g id="torso"><g id="c-upper">
          <g id="right-arm">${this.arm('B', 'back')}</g>
          <g id="shirt">${this.shirt()}</g>
          <g id="head">${this.face()}</g>
          <g id="left-arm">${this.arm('F', 'paper')}</g>
        </g></g>
      </g></g>
    </svg>`;
  },
};

(() => {
  if (!window.gsap) return;

  /* ===== Pacing: tweak these ===== */
  const CFG = {
    popStart: 0.1,     // letters appear
    introEnd: 1.5,     // character walks in
    collectEnd: 4.0,   // last letter grabbed
    touch: 0.12,       // pause at each letter
    minHop: 0.2,       // shortest walk between letters
    windup: 0.28,      // anticipation before each shove
    shove: 0.75,       // how long each shove drags the name
    hold: 0.6,         // hold on the finished name
    contactX: 76,      // feet-to-hands distance while pushing (character units)
  };
  const css = getComputedStyle(document.documentElement);
  const INK = css.getPropertyValue('--primary-color').trim();
  const SCATTER = css.getPropertyValue('--secondary-color').trim();

  const $ = (s, r = document) => r.querySelector(s);
  const html = document.documentElement;
  const pl = $('#preloader'), stage = $('.pl-stage'), word = $('.pl-word'), grid = $('.pl-grid');
  const pushEl = $('.pl-push'), guide = $('.pl-guide'), marks = $('.pl-marks'), marker = $('.pl-marker');
  const bar = $('.pl-bar'), fill = $('.pl-bar-fill'), skipBtn = $('.pl-skip');
  const count = $('.pl-count'), pctEl = $('.pl-count b');
  const letters = [...document.querySelectorAll('.pl-l')];
  const glyphs = letters.map((l) => l.querySelector('.pl-g'));
  const charEl = $('.pl-char');
  charEl.innerHTML = CHARACTER.svg();
  const byId = (id) => document.getElementById(id);
  const P = Object.fromEntries(['root', 'bob', 'upper', 'head', 'eyes', 'legF', 'kneeF', 'legB', 'kneeB',
    'armF', 'elbowF', 'armB', 'elbowB', 'shadow'].map((id) => [id, byId('c-' + id)]));
  const POSE = Object.fromEntries(Object.keys(JOINTS).map((id) => [id, byId(id)]));
  Object.entries(JOINTS).forEach(([id, origin]) => gsap.set(POSE[id], { svgOrigin: origin }));
  const ARMS = [POSE['left-arm'], POSE['right-arm']];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');

  // Character state, driven by the timeline and drawn every frame.
  //  A: walk amount, stance: braced push stance, crouch: knees loaded,
  //  brace: elbows locked straight, breath: depth of the breathing cycle.
  const S = { x: 0, y: 0, A: 0, phase: 0, reach: 0, reachAng: -120, face: 1, sq: 0, nod: 0,
              stance: 0, crouch: 0, brace: 0, breath: 0.5 };
  const breath = { v: 0 };
  gsap.to(breath, { v: 1, duration: 1.7, ease: 'sine.inOut', yoyo: true, repeat: -1 });
  const amps = letters.map(() => ({ v: 0 }));
  let tl, L, spec, running = false, speed = 1;

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const [VBX, VBY, VBW, VBH] = RIG.viewBox;

  // Where the near hand ends up (in character units) for a given arm angle.
  const handAt = (deg) => {
    const a = deg * Math.PI / 180;
    return { x: RIG.frontArmX - RIG.armLength * Math.sin(a), y: RIG.shoulder.y + RIG.armLength * Math.cos(a) };
  };

  // Scatter layout as viewport fractions, so a resize keeps the same composition.
  function newSpec() {
    const topFirst = Math.random() < 0.5;
    spec = letters.map((_, i) => ({
      fx: 0.12 + i * 0.19 + rnd(-0.04, 0.04),
      fy: (i % 2 === 0) === topFirst ? rnd(0.14, 0.26) : rnd(0.68, 0.75),
      r: rnd(-42, 42),
      s: rnd(0.55, 1),
      o: Math.random() * Math.PI * 2,
    }));
  }

  function measure() {
    const vw = innerWidth, vh = innerHeight;
    const fs = Math.min(vw * 0.16, vh * 0.2, 190);
    word.style.fontSize = fs + 'px';
    gsap.set(letters, { clearProps: 'transform' });
    gsap.set(pushEl, { x: 0 });
    const base = $('.pl-base').getBoundingClientRect().top;
    const homes = letters.map((l) => {
      const r = l.getBoundingClientRect();
      return { cx: r.left + r.width / 2, cy: r.top + r.height / 2 };
    });
    const wr = word.getBoundingClientRect();
    const charH = clamp(fs * 1.5, 150, 280);
    const k = charH / VBH;
    const W = VBW * k;
    charEl.style.width = W + 'px';
    charEl.style.height = charH + 'px';
    // How far the name starts off-centre: as much room as the pushing stance allows.
    const room = vw - (wr.right + (CFG.contactX + 34) * k) - 8;
    const pushD = clamp(room, 24, Math.min(vw * 0.16, 220));
    return { vw, vh, fs, base, homes, wordR: wr.right, charH, W, k, pushD,
             cols: vw < 640 ? 3 : vw < 1024 ? 4 : 6 };
  }

  function buildScaffold() {
    grid.innerHTML = '<div class="pl-col"></div>'.repeat(L.cols);
    guide.style.top = L.base + 'px';
    marks.innerHTML = '';
    for (let j = 1; j < L.cols; j++) {
      const m = document.createElement('div');
      m.className = 'pl-cross';
      m.style.left = (L.vw * j / L.cols) + 'px';
      m.style.top = L.base + 'px';
      marks.appendChild(m);
    }
  }

  function build() {
    if (tl) tl.kill();
    L = measure();
    buildScaffold();
    tl = gsap.timeline({ paused: true, onUpdate: updateBar, onComplete: finish });
    tl.timeScale(speed);
    tl.set([stage, bar, skipBtn, count], { autoAlpha: 1, y: 0 }, 0);
    tl.set(grid, { autoAlpha: 1 }, 0);
    tl.set(letters, { opacity: 1 }, 0);
    tl.set(marker, { scaleX: 0 }, 0);
    tl.set(Object.values(POSE), { rotation: 0, x: 0, y: 0, skewX: 0 }, 0);
    (reduce.matches ? buildReduced : buildFull)();
  }

  function buildFull() {
    const { homes, k, pushD } = L;
    const scat = spec.map((p) => ({ x: clamp(p.fx * L.vw, 40, L.vw - 40), y: p.fy * L.vh, r: p.r, s: p.s }));
    tl.set(pushEl, { x: pushD }, 0);

    // Phase 1: scattered data points
    const order = [2, 0, 4, 1, 3];
    letters.forEach((el, i) => {
      tl.fromTo(el,
        { x: scat[i].x - (homes[i].cx + pushD), y: scat[i].y - homes[i].cy, rotation: scat[i].r, scale: 0, color: SCATTER },
        { scale: scat[i].s, duration: 0.6, ease: 'back.out(1.7)', immediateRender: true },
        CFG.popStart + order[i] * 0.11);
    });
    tl.fromTo(amps, { v: 0 }, { v: 1, duration: 0.5 }, 0.3);
    tl.fromTo(guide, { scaleX: 0 }, { scaleX: 1, duration: 1.1, ease: 'expo.inOut' }, 0.25);
    tl.fromTo(marks.children, { scale: 0, autoAlpha: 0 },
      { scale: 1, autoAlpha: 1, duration: 0.4, ease: 'back.out(2)', stagger: 0.05 }, 0.7);

    // Phase 2: walk to each letter. Letters above the baseline get an overhead
    // reach; letters below get a lower, forward reach.
    const stops = [];
    let prev = { x: -L.W };
    scat.forEach((s) => {
      const dir = s.x >= prev.x ? 1 : -1;
      const ang = s.y < L.base ? -125 : -55;
      const h = handAt(ang);
      const p = { x: s.x - dir * h.x * k, y: clamp(s.y - h.y * k, 0, L.vh - 10), dir, ang };
      stops.push(p);
      prev = p;
    });
    const start = { x: -L.W, y: stops[0].y };
    tl.set(S, { x: start.x, y: start.y, A: 0, phase: 0, reach: 0, reachAng: stops[0].ang, face: 1, sq: 0, nod: 0,
                stance: 0, crouch: 0, brace: 0, breath: 0.5 }, 0);

    const from = (i) => (i ? stops[i - 1] : start);
    const dists = stops.map((p, i) => Math.hypot(p.x - from(i).x, p.y - from(i).y));
    const sum = dists.reduce((a, b) => a + b, 0);
    const travel = (CFG.collectEnd - CFG.introEnd) - stops.length * CFG.touch;
    const spare = travel - stops.length * CFG.minHop;
    const stride = 40 * k;

    let t = CFG.introEnd, phase = 0, face = 1;
    stops.forEach((p, i) => {
      const dur = CFG.minHop + spare * dists[i] / sum;
      phase += (dists[i] / stride) * Math.PI;
      walk(p, dur, t, phase, face !== p.dir ? (face = p.dir) : null);
      tl.set(S, { reachAng: p.ang }, t);
      t += dur;

      // touch: squash, reach, letter snaps onto the baseline
      tl.to(S, { sq: 0.06, duration: 0.07, ease: 'power2.out' }, t - 0.02);
      tl.to(S, { sq: 0, duration: 0.2, ease: 'back.out(3)' }, t + 0.05);
      tl.to(S, { reach: 1, duration: 0.12, ease: 'power2.out' }, t - 0.1);
      tl.to(S, { reach: 0, duration: 0.28, ease: 'power2.inOut' }, t + CFG.touch + 0.05);
      tl.to(amps[i], { v: 0, duration: 0.1 }, t - 0.05);
      tl.to(letters[i], { x: 0, y: 0, rotation: 0, scale: 1, duration: 0.6, ease: 'back.out(1.7)' }, t);
      tl.to(letters[i], { color: INK, duration: 0.3 }, t);
      t += CFG.touch;
    });

    // Phase 3: brace against the name and shove it into the centre.
    t = Math.max(t, CFG.collectEnd);
    const last = stops[stops.length - 1];
    const contact = { x: L.wordR + pushD + CFG.contactX * k, y: L.base };
    const d = Math.hypot(contact.x - last.x, contact.y - last.y);
    const dur = clamp(d / (L.vw * 1.2), 0.25, 0.45);
    phase += (d / stride) * Math.PI;
    const dir = contact.x >= last.x ? 1 : -1;
    walk(contact, dur, t, phase, face !== dir ? (face = dir) : null);
    t += dur;
    if (face !== -1) tl.to(S, { face: -1, duration: 0.16, ease: 'power2.inOut' }, t);
    t += 0.12;
    t = push(t, contact.x);

    // The name is home: highlighter swipe, catch breath, then the reveal.
    tl.to(marker, { scaleX: 1, duration: 0.45, ease: 'power3.inOut' }, t + 0.1);
    addReveal(t, t + Math.max(CFG.hold, 0.75));
  }

  /* Heavy push: plant -> (anticipation -> strain) x strokes -> follow-through -> recover.
     Feet stay in a braced stance; the body slides only as far as the name gives way. */
  function push(t, x0) {
    const { pushD } = L;
    const strokes = pushD > 90 ? 2 : 1;
    const seg = pushD / strokes;
    const torso = POSE.torso, head = POSE.head, hair = POSE.hair, shirt = POSE.shirt;

    // plant: hands up on the letters, settle into the stance
    tl.to(ARMS, { rotation: -62, duration: 0.2, ease: 'power2.out' }, t);
    tl.to(S, { brace: 1, stance: 0.6, breath: 0, duration: 0.22, ease: 'power2.out' }, t);
    tl.to(torso, { rotation: 14, duration: 0.22, ease: 'power2.out' }, t);
    t += 0.22;

    for (let i = 0; i < strokes; i++) {
      // Anticipation: sink and lean back to load the legs.
      tl.to(torso, { rotation: -4, duration: CFG.windup, ease: 'power2.in' }, t);
      tl.to(S, { crouch: 1, duration: CFG.windup, ease: 'power2.in' }, t);
      tl.to(head, { rotation: -5, duration: CFG.windup, ease: 'power2.in' }, t + 0.04);
      tl.to(ARMS, { rotation: -70, duration: CFG.windup, ease: 'power2.in' }, t);
      t += CFG.windup;

      // Strain: drive forward hard, arms locked, the name drags against him.
      const x = pushD - seg * (i + 1);
      tl.to(torso, { rotation: 34, duration: 0.35, ease: 'expo.out' }, t);
      tl.to(S, { crouch: 0.35, stance: 1, duration: 0.35, ease: 'expo.out' }, t);
      tl.to(ARMS, { rotation: -58, duration: 0.3, ease: 'power3.out' }, t);
      tl.to(pushEl, { x, duration: CFG.shove, ease: 'power3.out' }, t + 0.08);
      tl.to(S, { x: x0 - seg * (i + 1), duration: CFG.shove, ease: 'power3.out' }, t + 0.08);

      // Micro-tremor at peak effort (even repeat count, so each ends where it started).
      tl.fromTo(ARMS, { x: 0 }, { x: 0.9, duration: 0.035, ease: 'none', yoyo: true, repeat: 15 }, t + 0.1);
      tl.fromTo(torso, { y: 0 }, { y: 0.6, duration: 0.045, ease: 'none', yoyo: true, repeat: 11 }, t + 0.12);

      // Secondary motion: head drops into the effort, hair and shirt lag behind.
      tl.to(head, { rotation: 9, duration: 0.4, ease: 'power3.out' }, t + 0.06);
      tl.to(hair, { rotation: -7, duration: 0.16, ease: 'power2.out' }, t + 0.08);
      tl.to(hair, { rotation: 0, duration: 0.45, ease: 'back.out(3)' }, t + 0.24);
      tl.to(shirt, { skewX: -5, duration: 0.14, ease: 'power2.out' }, t + 0.05);
      tl.to(shirt, { skewX: 0, duration: 0.4, ease: 'back.out(2.5)' }, t + 0.19);
      t += CFG.shove + 0.08;

      if (i < strokes - 1) {
        // Brief recovery between shoves.
        tl.to(torso, { rotation: 20, duration: 0.22, ease: 'sine.inOut' }, t);
        tl.to(head, { rotation: 2, duration: 0.22, ease: 'sine.inOut' }, t);
        tl.to(S, { stance: 0.7, duration: 0.22, ease: 'sine.inOut' }, t);
        t += 0.22;
      }
    }

    // Follow-through: the body carries past the stop, then releases and straightens.
    tl.to(torso, { rotation: 40, duration: 0.12, ease: 'power2.out' }, t - 0.05);
    tl.to(torso, { rotation: 0, duration: 0.6, ease: 'back.out(1.6)' }, t + 0.15);
    tl.to(ARMS, { rotation: 0, duration: 0.45, ease: 'power2.inOut' }, t + 0.1);
    tl.to(S, { brace: 0, stance: 0, crouch: 0, duration: 0.5, ease: 'power2.inOut' }, t + 0.1);
    tl.to(head, { rotation: 0, duration: 0.5, ease: 'back.out(2)' }, t + 0.18);
    tl.to(hair, { rotation: 5, duration: 0.12, ease: 'power2.out' }, t + 0.24);
    tl.to(hair, { rotation: 0, duration: 0.4, ease: 'back.out(3)' }, t + 0.36);

    // Catch his breath: deep at first, settling down.
    tl.to(S, { breath: 1.8, duration: 0.3, ease: 'sine.out' }, t + 0.2);
    tl.to(S, { breath: 0.7, duration: 1.6, ease: 'sine.inOut' }, t + 0.8);
    return t;
  }

  function walk(p, dur, t, phase, newFace) {
    const up = Math.min(0.15, dur * 0.35), down = Math.min(0.12, dur * 0.3);
    tl.to(S, { x: p.x, y: p.y, duration: dur, ease: 'power1.inOut' }, t);
    tl.to(S, { phase, duration: dur, ease: 'power1.inOut' }, t);
    tl.to(S, { A: 1, duration: up, ease: 'power2.out' }, t);
    tl.to(S, { A: 0.15, duration: down, ease: 'power2.in' }, t + dur - down);
    if (newFace) tl.to(S, { face: newFace, duration: 0.14, ease: 'power2.inOut' }, t);
  }

  function addReveal(t, revealAt = t + CFG.hold) {
    tl.addLabel('assembled', t);
    tl.addLabel('reveal', revealAt);
    tl.to(stage, { autoAlpha: 0, y: -20, duration: 0.35, ease: 'power2.in' }, 'reveal');
    tl.to([bar, skipBtn, count], { autoAlpha: 0, duration: 0.25 }, 'reveal');
    if (reduce.matches) {
      tl.to(grid, { autoAlpha: 0, duration: 0.4 }, 'reveal+=0.1');
    } else {
      tl.to(grid.children, { yPercent: -100, duration: 0.85, ease: 'expo.inOut',
        stagger: { each: 0.06, from: 'center' } }, 'reveal+=0.12');
    }
  }

  // Reduced motion: no scatter, walking or pushing; the name and character fade in place.
  function buildReduced() {
    tl.set(pushEl, { x: 0 }, 0);
    tl.set(letters, { x: 0, y: 0, rotation: 0, scale: 1, color: INK }, 0);
    tl.set(amps, { v: 0 }, 0);
    tl.set(S, { x: Math.min(L.wordR + 34 * L.k + L.fs * 0.04, L.vw - 32 * L.k - 6), y: L.base,
                A: 0, phase: 0, reach: 0, face: -1, sq: 0, nod: 0, stance: 0, crouch: 0, brace: 0, breath: 0.5 }, 0);
    tl.fromTo(letters, { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.12, immediateRender: true }, 0.1);
    tl.fromTo(charEl, { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: true }, 0.6);
    tl.fromTo(guide, { opacity: 0 }, { opacity: 0.6, duration: 0.4 }, 0.2);
    tl.fromTo(marker, { opacity: 0, scaleX: 1 }, { opacity: 1, duration: 0.3 }, 1.0);
    addReveal(1.3);
  }

  function updateBar() {
    const p = clamp(tl.time() / tl.labels.assembled, 0, 1);
    fill.style.transform = `scaleX(${p.toFixed(4)})`;
    pctEl.textContent = Math.round(p * 100);
  }

  /* ----- per-frame drawing: letter drift + walk cycle + breathing ----- */
  const rot = (el, a, x, y) => el.setAttribute('transform', `rotate(${a.toFixed(2)} ${x} ${y})`);
  const limb = (el, dx, dy, a, y) =>
    el.setAttribute('transform', `translate(${dx} ${dy.toFixed(2)}) rotate(${a.toFixed(2)} 0 ${y})`);

  function frame(time) {
    for (let i = 0; i < glyphs.length; i++) {
      const a = amps[i].v, o = spec[i].o;
      glyphs[i].style.transform = a < 0.001 ? '' :
        `translate3d(${((Math.sin(time * 1.3 + o) * 6 + Math.sin(time * 3.7 + o * 2) * 1.2) * a).toFixed(2)}px,` +
        `${(Math.cos(time * 1.1 + o) * 6 * a).toFixed(2)}px,0) rotate(${(Math.sin(time * 0.9 + o) * 4 * a).toFixed(2)}deg)`;
    }
    drawChar(time);
  }

  function drawChar(time) {
    const { A, phase: p, reach: r, stance: st, crouch: cr, brace: br } = S;
    const s = Math.sin(p), c = Math.cos(p);
    charEl.style.transform =
      `translate3d(${(S.x + VBX * L.k).toFixed(1)}px, ${(S.y + VBY * L.k).toFixed(1)}px, 0)`;

    // Legs: forward swing = negative angle (facing right); knees bend on the swing.
    // Push stance: near leg forward and bent, far leg driven back; crouch loads both knees.
    limb(P.legF, 2, 0, -30 * A * s - 14 * st - 10 * cr, RIG.hip.y);
    rot(P.kneeF, A * (6 + 45 * Math.max(0, c)) + 22 * st + 26 * cr, 0, RIG.knee.y);
    limb(P.legB, -4, 0, 30 * A * s + 18 * st + 4 * cr, RIG.hip.y);
    rot(P.kneeB, A * (6 + 45 * Math.max(0, -c)) + 18 * cr, 0, RIG.knee.y);

    // Breathing: chest expands from the hip and the shoulders rise; damped while walking or straining.
    const deep = S.breath * (1 - A) * (1 - 0.8 * st) * breath.v;
    const shoulders = -1.6 * deep;

    // Arms swing against the legs; the near arm blends into a reach; brace locks the elbows.
    const swing = 26 * A * s, bend = -(20 * A + 6) * (1 - br);
    limb(P.armF, RIG.frontArmX, shoulders, swing * (1 - r) + S.reachAng * r, RIG.shoulder.y);
    rot(P.elbowF, bend * (1 - r) - 4 * r, 0, RIG.elbow.y);
    limb(P.armB, -3, shoulders, -swing, RIG.shoulder.y);
    rot(P.elbowB, bend, 0, RIG.elbow.y);

    const bob = -4 * A * Math.abs(c) + 7 * cr + 9 * st; // sink so both feet stay planted
    P.bob.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
    P.upper.setAttribute('transform',
      `rotate(${(6 * A).toFixed(2)} 0 ${RIG.hip.y}) translate(0 ${RIG.hip.y}) scale(1 ${(1 + 0.022 * deep).toFixed(4)}) translate(0 ${-RIG.hip.y})`);
    rot(P.head, S.nod + 2 * A * s - 3 * r, RIG.neck.x, RIG.neck.y);

    // blink every ~2.6s
    const b = (time % 2.6) < 0.11 ? 0.15 : 1;
    P.eyes.setAttribute('transform', `translate(0 ${(-228 * (1 - b)).toFixed(2)}) scale(1 ${b})`);

    const f = Math.abs(S.face) < 0.02 ? 0.02 * Math.sign(S.face || 1) : S.face;
    P.root.setAttribute('transform', `scale(${(f * (1 + S.sq * 0.5)).toFixed(3)} ${(1 - S.sq).toFixed(3)})`);
    P.shadow.setAttribute('transform', `scale(${(1 + bob * 0.03).toFixed(3)} 1)`);
  }

  /* ----- lifecycle ----- */
  function start() {
    newSpec();
    html.classList.add('is-loading');
    pl.classList.remove('is-ready');
    gsap.set(charEl, { opacity: 1 });
    build();
    tl.progress(0);
    drawChar(0);
    pl.classList.add('is-ready');
    running = true;
    gsap.ticker.remove(frame);
    gsap.ticker.add(frame);
    // ?t=2.4 freezes the intro at that second (handy for checking a pose).
    const freeze = parseFloat(new URLSearchParams(location.search).get('t'));
    if (!isNaN(freeze)) { tl.pause(freeze); updateBar(); return; }
    tl.play(0);
  }

  function finish() {
    running = false;
    gsap.ticker.remove(frame);
    html.classList.remove('is-loading');
  }

  // Jump to the finished name and play the reveal from there.
  function skip() {
    if (!running) return;
    if (tl.time() < tl.labels.reveal) tl.seek('reveal');
    tl.play();
  }

  skipBtn.addEventListener('click', skip);
  addEventListener('keydown', (e) => { if (e.key === 'Escape') skip(); });
  $('[data-replay]').addEventListener('click', start);
  document.querySelectorAll('[data-speed]').forEach((btn) => btn.addEventListener('click', () => {
    speed = +btn.dataset.speed;
    if (tl) tl.timeScale(speed);
    document.querySelectorAll('[data-speed]').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
  }));

  // Recompute every position on resize and continue from the same moment.
  let rz;
  addEventListener('resize', () => {
    clearTimeout(rz);
    rz = setTimeout(() => {
      if (!running) return;
      const t = tl.time(), paused = tl.paused();
      build();
      tl.seek(t);
      if (!paused) tl.play();
    }, 120);
  });

  const fontReady = document.fonts ? document.fonts.load('900 100px InterVariable', 'THUẬN') : Promise.resolve();
  Promise.race([fontReady, new Promise((r) => setTimeout(r, 1500))]).then(start, start);
})();
</script>
</body>
</html>
