  <line x1="162" y1="552" x2="176" y2="552" stroke="#4A3728" stroke-width="2" stroke-linecap="round"/>
  <path d="M246 562 L246 552 Q246 546 238 546 L216 546 Q206 548 204 556 L204 562 Z" fill="#F7F7F5" stroke="#4A3728" stroke-width="2.5" stroke-linejoin="round"/>
