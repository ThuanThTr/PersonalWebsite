  <main>

    <section class="about-section" aria-label="world airports map">
      <div class="about">
        <h2>airports</h2>
        <div class="about-list">
          <div class="about-item">
            <h3>World Airports</h3>
            <p class="languages-tag">maplibre, supercluster <span class="project-date">2026</span></p>
            <p>Every airport in the <a href="https://openflights.org/data" target="_blank" rel="noopener noreferrer" class="location-link">OpenFlights</a> database is plotted on one map. Zoom in, and clusters split apart. Click a cluster to zoom into it, or an airport to see its name and code.</p>
            <p class="map-status" id="map-status">Loading airports…</p>
            <div class="map-container" id="map"></div>
          </div>

      </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module">
    import Supercluster from 'https://cdn.jsdelivr.net/npm/supercluster@8.0.1/+esm';
    import { csvParseRows } from 'https://cdn.jsdelivr.net/npm/d3-dsv@3.0.1/+esm';

    const AIRPORTS_URL = 'https://raw.githubusercontent.com/jpatokal/openflights/master/data/airports.dat';
    const COUNTRIES_URL = 'countries.geo.json';
    const GLYPHS_URL = 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf';

    const status = document.getElementById('map-status');
    const isCluster = ['has', 'point_count'];

    // Columns: id, name, city, country, iata, icao, lat, lng, … ("\N" marks a missing value)
    const features = await fetch(AIRPORTS_URL)
      .then((r) => r.text())
      .then((csv) => csvParseRows(csv, ([, name, city, country, iata, , lat, lng]) => ({
        type: 'Feature',
        properties: { name, city, country, iata: iata === '\\N' ? '' : iata },
        geometry: { type: 'Point', coordinates: [+lng, +lat] }
      })))
      .catch((err) => {
        status.textContent = 'Could not load the airport data. Please try again later.';
        throw err;
      });

    // Loaded here rather than by MapLibre so a failure is reported on the page and
    // the airports still show without a base map.
    const countries = await fetch(COUNTRIES_URL)
      .then((r) => {
        if (!r.ok) throw new Error(`${COUNTRIES_URL}: HTTP ${r.status}`);
        return r.json();
      })
      .catch((err) => {
        console.error(err);
        return null;
      });

    const index = new Supercluster({ radius: 10.4, maxZoom: 8 }).load(features);

    const map = new maplibregl.Map({
      container: 'map',
      center: [0, 20],
      zoom: 1.5,
      style: {
        version: 8,
        glyphs: GLYPHS_URL,
        sources: {
          countries: {
            type: 'geojson',
            data: countries ?? { type: 'FeatureCollection', features: [] },
            attribution: 'Made with <a href="https://www.naturalearthdata.com/">Natural Earth</a>'
          },
          airports: {
            type: 'geojson',
            data: { type: 'FeatureCollection', features: [] }
          }
        },
        layers: [
          { id: 'background', type: 'background', paint: { 'background-color': '#fafafa' } },
          { id: 'countries-fill', type: 'fill', source: 'countries', paint: { 'fill-color': '#d4d4d8' } },
          { id: 'countries-line', type: 'line', source: 'countries', paint: { 'line-color': '#fafafa', 'line-width': 0.6 } },
          {
            id: 'clusters',
            type: 'circle',
            source: 'airports',
            filter: isCluster,
            // Large clusters sort to the bottom so smaller dots stay visible
            layout: { 'circle-sort-key': ['-', ['get', 'point_count']] },
            paint: {
              'circle-color': ['step', ['get', 'point_count'], '#51bbd6', 10, '#f1f075', 100, '#f28cb1'],
              'circle-radius': ['step', ['get', 'point_count'], 5, 10, 8, 100, 13],
              'circle-stroke-width': 1,
              'circle-stroke-color': '#fff'
            }
          },
          {
            id: 'cluster-count',
            type: 'symbol',
            source: 'airports',
            filter: isCluster,
            layout: {
              'text-field': '{point_count_abbreviated}',
              'text-font': ['Noto Sans Bold'],
              'text-size': 9
            },
            paint: { 'text-color': '#333' }
          },
          {
            id: 'unclustered',
            type: 'circle',
            source: 'airports',
            filter: ['!', isCluster],
            paint: {
              'circle-color': '#11b4da',
              'circle-radius': 3,
              'circle-stroke-width': 0.5,
              'circle-stroke-color': '#fff'
            }
          }
        ]
      }
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');

    const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false });

    map.on('click', 'unclustered', (e) => {
      const { geometry, properties: { name, city, country, iata } } = e.features[0];
      const title = document.createElement('strong');
      title.textContent = name;
      const content = document.createElement('div');
      content.append(title, document.createElement('br'), `${city}, ${country}${iata ? ` (${iata})` : ''}`);
      popup.setLngLat(geometry.coordinates).setDOMContent(content).addTo(map);
    });

    map.on('click', 'clusters', (e) => {
      const { geometry, properties } = e.features[0];
      map.easeTo({ center: geometry.coordinates, zoom: index.getClusterExpansionZoom(properties.cluster_id) });
    });

    for (const layer of ['clusters', 'unclustered']) {
      map.on('mouseenter', layer, () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', layer, () => { map.getCanvas().style.cursor = ''; popup.remove(); });
    }

    function updateClusters() {
      const zoom = Math.floor(map.getZoom());
      const bbox = map.getBounds().toArray().flat();
      map.getSource('airports').setData({ type: 'FeatureCollection', features: index.getClusters(bbox, zoom) });
      status.textContent = countries
        ? `${features.length.toLocaleString()} airports · zoom level ${zoom}`
        : location.protocol === 'file:'
          ? 'The base map can’t load from a file:// page. Run python3 -m http.server in the site folder and open it via localhost.'
          : `Could not load ${COUNTRIES_URL}, so the base map is hidden.`;
    }

    map.on('load', updateClusters);
    map.on('moveend', updateClusters);
  </script>

  <!-- 100% privacy-first analytics -->
